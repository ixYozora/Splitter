<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deine Gruppen · Splitter</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="../static/fonts/ibm-plex-sans-400.woff2" th:href="@{/fonts/ibm-plex-sans-400.woff2}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="../static/fonts/ibm-plex-sans-500.woff2" th:href="@{/fonts/ibm-plex-sans-500.woff2}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="../static/fonts/ibm-plex-sans-600.woff2" th:href="@{/fonts/ibm-plex-sans-600.woff2}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="../static/fonts/ibm-plex-mono-400.woff2" th:href="@{/fonts/ibm-plex-mono-400.woff2}">
  <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
  <noscript>
    <style>.controls { display: none; }</style>
  </noscript>
</head>
<body class="page page-overview">

<header class="topbar">
  <a class="wordmark" href="/" th:href="@{/}">Splitter</a>

  <details class="account">
    <summary class="account__trigger">
      <span class="account__name" th:text="${login} ?: 'Konto'">MaxHub</span>
      <img class="account__avatar" alt="" width="36" height="36"
           th:if="${avatarUrl != null}" th:src="${avatarUrl}">
      <span class="account__avatar account__avatar--initial" th:unless="${avatarUrl != null}"
            th:text="${login != null} ? ${#strings.toUpperCase(#strings.substring(login,0,1))} : '?'">M</span>
      <span class="account__disclosure" aria-hidden="true">
        <svg class="account__chevron" viewBox="0 0 12 12" focusable="false">
          <polyline points="2.5,4.5 6,8 9.5,4.5"></polyline>
        </svg>
      </span>
      <span class="visually-hidden">Konto-Menü öffnen</span>
    </summary>
    <!-- Verbindung vom Pfeilkreis zum abgesetzten Menü: steigt flach aus dem
         Kreis, knickt im Scheitel und fällt von dort in die Menükante. -->
    <svg class="account__connector" viewBox="0 -20 72 70" aria-hidden="true" focusable="false">
      <path pathLength="100"
            d="M0 0 L23.7 -11 Q30 -14 32.6 -7.5 L56 50"></path>
    </svg>
    <div class="account__menu">
      <p class="account__handle" th:text="${login} ?: ''">MaxHub</p>
      <form method="post" th:action="@{/logout}">
        <button class="button button--quiet" type="submit">Abmelden</button>
      </form>
    </div>
  </details>
</header>

<main class="sheet"
      th:with="anzahlGruppen=${gruppen != null} ? ${#lists.size(gruppen.details())} : 0">

  <div class="sheet__head">
    <h1 class="sheet__title" id="sheetTitle">Deine Gruppen</h1>
    <p class="sheet__tally">
      <span th:text="${offeneAnzahl} ?: 0">0</span> offen<span class="sheet__sep">·</span><span
        th:text="${geschlosseneAnzahl} ?: 0">0</span> geschlossen
    </p>
  </div>

  <section class="compose" aria-label="Neue Gruppe anlegen">
    <form method="post" th:action="@{/add}" th:object="${gruppenForm}" class="compose__form"
          id="composeForm">
      <label class="visually-hidden" for="gName">Gruppenname</label>
      <input class="compose__input" id="gName" type="text" name="gruppenName" th:field="*{gruppenName}"
             autocomplete="off" required minlength="5" maxlength="30"
             aria-describedby="gNameHint" placeholder="z. B. Reisegruppe"
             th:attr="aria-invalid=${#fields.hasErrors('gruppenName')} ? 'true' : null">
      <button class="button" type="submit">Anlegen</button>
      <p class="compose__hint" id="gNameHint">5 bis 30 Zeichen.</p>
      <p class="compose__error" th:if="${#fields.hasErrors('gruppenName')}">
        <svg class="compose__error-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.25"></circle>
          <line x1="8" y1="4.75" x2="8" y2="8.5"></line>
          <line x1="8" y1="11" x2="8" y2="11.01"></line>
        </svg>
        <span th:errors="*{gruppenName}"></span>
      </p>
    </form>
  </section>

  <div class="controls" th:if="${anzahlGruppen > 6}">
    <div class="search">
      <label class="visually-hidden" for="groupSearch">Gruppe suchen</label>
      <span class="search__field">
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="8.5" cy="8.5" r="5.5"></circle>
          <line x1="12.5" y1="12.5" x2="17.5" y2="17.5"></line>
        </svg>
        <input id="groupSearch" type="search" autocomplete="off" placeholder="Gruppenname">
      </span>
    </div>

    <fieldset class="segmented">
      <legend class="visually-hidden">Nach Status filtern</legend>
      <input type="radio" name="statusFilter" id="statusAlle" value="alle" checked>
      <label for="statusAlle">Alle</label>
      <input type="radio" name="statusFilter" id="statusOffen" value="offen">
      <label for="statusOffen">Offen</label>
      <input type="radio" name="statusFilter" id="statusGeschlossen" value="geschlossen">
      <label for="statusGeschlossen">Geschlossen</label>
    </fieldset>
  </div>

  <div class="ledger__columns" aria-hidden="true" th:if="${anzahlGruppen > 0}">
    <span>Gruppe</span>
    <span>Mitglieder</span>
    <span>Status</span>
    <span>Dein Anteil</span>
  </div>

  <ul class="ledger ledger--intro" id="ledger" aria-labelledby="sheetTitle">
    <th:block th:if="${gruppen != null}">
      <li class="ledger__row" th:each="gruppe, iter : ${gruppen.details()}"
          th:classappend="${gruppe.geschlossen()} ? 'is-closed' : ''"
          th:style="'--i:' + ${iter.index}">
        <a class="ledger__link" href="#" th:href="@{/gruppe(id=${gruppe.id()})}">
          <span class="ledger__name" th:text="${gruppe.gruppenName()}">Reisegruppe</span>
          <span class="ledger__members" th:with="anzahl=${#lists.size(gruppe.personen())}"
                th:text="${anzahl} + (${anzahl == 1} ? ' Mitglied' : ' Mitglieder')">3 Mitglieder</span>
          <span class="ledger__status"
                th:text="${gruppe.geschlossen()} ? 'Geschlossen' : 'Offen'">Offen</span>
          <span class="ledger__amount"
                th:with="betrag=${gruppe.nettoBetrag().getNumber().doubleValue()},
                         absBetrag=${betrag < 0 ? -betrag : betrag}"
                th:classappend="${betrag < 0} ? 'is-schuld' : (${betrag > 0} ? 'is-guthaben' : 'is-glatt')"
                th:text="${(betrag > 0 ? '+' : (betrag < 0 ? '−' : ''))
                         + #numbers.formatDecimal(absBetrag, 1, 'POINT', 2, 'COMMA') + ' €'}">+18,40 €</span>
        </a>
      </li>
    </th:block>
  </ul>

  <div class="abschluss" th:if="${anzahlGruppen > 0}"
       th:with="gesamt=${gesamtBetrag != null} ? ${gesamtBetrag.getNumber().doubleValue()} : 0,
                absGesamt=${gesamt < 0 ? -gesamt : gesamt}">
    <span class="abschluss__label">Dein Stand</span>
    <span class="abschluss__betrag"
          th:classappend="${gesamt < 0} ? 'is-schuld' : (${gesamt > 0} ? 'is-guthaben' : 'is-glatt')"
          th:text="${(gesamt > 0 ? '+' : (gesamt < 0 ? '−' : ''))
                   + #numbers.formatDecimal(absGesamt, 1, 'POINT', 2, 'COMMA') + ' €'}">+6,40 €</span>
  </div>

  <p class="ledger__count" id="ledgerCount" hidden></p>
  <p class="visually-hidden" id="filterStatus" role="status" aria-live="polite"></p>

  <p class="note" id="noMatches" hidden>Keine Gruppe passt zu deinem Filter.</p>

</main>

<script src="../static/js/script.js" th:src="@{/js/script.js}" defer></script>
</body>
</html>
