server:
  port:
    9000

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: read:public_repo
  datasource:
    password: ${POSTGRES_PASSWORD}
    username: ${POSTGRES_USER}
    # Assembled from parts so POSTGRES_DB actually decides the database instead
    # of only naming the one the container creates. The defaults are the local
    # setup, so a plain `./gradlew bootRun` needs no extra variables. Inside
    # compose only POSTGRES_HOST differs: there Postgres answers to its service
    # name, not to localhost.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:splitter}
