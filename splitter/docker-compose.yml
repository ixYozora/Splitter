services:
  database:
    image: postgres:18-alpine
    ports:
      # Ans Loopback gebunden: Docker haengt seine Regeln vor die von ufw, ein
      # offener Port waere also in jedem Netz erreichbar, in dem der Rechner haengt.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # Ohne diesen Eintrag legt das Image ein namenloses Volume an. Das haengt am
      # Container, ist nach einem `down` nicht mehr zuzuordnen und faellt bei
      # `down -v` weg -- der ganze Bestand also mit.
      - db-data:/var/lib/postgresql
    healthcheck:
      # The app runs Flyway on startup, so it must not start before Postgres
      # actually accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/splitter
      # Erst dieses Profil zieht application-keycloak.yaml dazu.
      - SPRING_PROFILES_ACTIVE=keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    # --import-realm zieht keycloak/splitter-realm.json, aber nur solange es das
    # Realm noch nicht gibt (Strategie IGNORE_EXISTING). Spaetere Aenderungen im
    # Adminbereich ueberschreibt es also nicht.
    command: start-dev --import-realm
    ports:
      # Same reasoning as the app: reachable through an SSH tunnel, not from the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Health lives on the management port 9000, which stays inside the network.
      - KC_HEALTH_ENABLED=true
      # One fixed base URL for everyone. The browser and a host-side `bootRun`
      # reach it through the /etc/hosts entry, the app container through compose
      # DNS, so the issuer string is identical from all three and token
      # validation passes.
      - KC_HOSTNAME=http://keycloak:8080
      # Diese vier stehen als ${...} in der Realm-Datei und werden beim Import
      # eingesetzt, damit keine Zugangsdaten im Repo landen. Der Realmname selbst
      # geht nicht: den liest Keycloak aus dem Dateinamen.
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_DEV_USER=${KEYCLOAK_DEV_USER}
      - KEYCLOAK_DEV_PASSWORD=${KEYCLOAK_DEV_PASSWORD}
    volumes:
      # start-dev keeps realms and users in an embedded H2 file; without this they
      # would be gone after every `docker compose down`.
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl, so bash talks to the management port directly.
      # HTTP/1.0 on purpose: the endpoint rejects a 1.1 request built this way.
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  keycloak-data:
