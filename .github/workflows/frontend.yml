name: frontend

# Nur wenn sich am Frontend oder an seinem Werkzeug etwas aendert.
on:
  push:
    branches: [main]
    paths:
      - 'splitter/src/main/resources/static/**'
      - 'splitter/package.json'
      - 'splitter/package-lock.json'
      - 'splitter/eslint.config.js'
      - 'splitter/stylelint.config.js'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'splitter/src/main/resources/static/**'
      - 'splitter/package.json'
      - 'splitter/package-lock.json'
      - 'splitter/eslint.config.js'
      - 'splitter/stylelint.config.js'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bewusst nicht an `check` gehaengt: sonst braucht jeder, der nur die Tests
  # laufen lassen will, eine Node-Installation. Die Regel steht hier.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./splitter
    steps:
      - name: checkout repo
        uses: actions/checkout@v7.0.1
      - name: install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: splitter/package-lock.json
      # ci statt install: haelt sich streng an package-lock.json.
      - name: install the tooling
        run: npm ci
      - name: lint
        run: npm run lint
