name: build and test

# Pushes to main plus every pull request. `on: [push]` alone spent a run on
# every branch push and gave pull requests no check of their own — a fork's
# pull request never ran at all, because the push happened on the fork.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token is allowed to write; this job only ever reads the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./splitter
    steps:
      - name: checkout repo
        uses: actions/checkout@v7.0.1
      - name: install latest jdk
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 25
          cache: 'gradle'
          distribution: 'temurin'
      - name: make gradlew executable
        run: chmod +x gradlew
      - name: run tests
        run: ./gradlew check
      # Without this a red build only leaves the raw Gradle log. The path is
      # relative to the repository, not to the working-directory above: that
      # default applies to `run` steps only, never to `uses`.
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: splitter/build/reports/tests/
